<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>আমার শেখার ঘর</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="logo">📚</span>
      <div>
        <h1>আমার শেখার ঘর</h1>
        <p id="todayLabel" class="muted"></p>
      </div>
    </div>
    <div class="stats" id="topStats"></div>
  </header>

  <div class="cloud-box" id="cloudBox"><span class="cloud-note">☁️ ক্লাউড লোড হচ্ছে...</span></div>

  <nav class="tabs" id="tabs">
    <button class="tab active" data-tab="today">☀️ আজকে</button>
    <button class="tab" data-tab="skills">🎯 স্কিল ও প্রোগ্রেস</button>
    <button class="tab" data-tab="talk">💬 কথা বলা</button>
    <button class="tab" data-tab="history">📅 ইতিহাস</button>
    <button class="tab" data-tab="settings">⚙️ সেটিংস</button>
  </nav>

  <main>
    <section id="view-today" class="view active"></section>
    <section id="view-skills" class="view"></section>
    <section id="view-talk" class="view"></section>
    <section id="view-history" class="view"></section>
    <section id="view-settings" class="view"></section>
  </main>

  <footer class="muted">
    করে করে শেখা 💪 · লগইন করলে প্রোগ্রেস ক্লাউডে সেভ হয় (Firebase)
  </footer>

  <div class="toast" id="toast"></div>
  <input type="file" id="importFile" accept="application/json" hidden />

  <script src="data/skills.js"></script>
  <script src="data/talk.js"></script>
  <script src="app.js"></script>
  <script src="talk.js"></script>
  <script type="module" src="cloud.js"></script>
</body>
</html>
